<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Una Galaxia de Amor para Ti</title>
  <meta name="theme-color" content="#03010a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9A%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #03010a;
      font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      touch-action: none;
    }

    /* Vignette suave para más profundidad */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(3,1,10,0.55) 100%);
    }

    #welcome {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #0c2a1f 0%, #040d0a 55%, #020508 100%);
      z-index: 1000;
      transition: opacity 1s ease, visibility 1s;
    }
    #welcome.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .welcome-card {
      background: linear-gradient(160deg, rgba(8,36,28,0.92), rgba(4,18,14,0.96));
      border: 1.5px solid rgba(52,211,153,0.55);
      border-radius: 32px;
      padding: 44px 40px;
      text-align: center;
      max-width: 380px; width: 90%;
      box-shadow:
        0 0 60px rgba(16,185,129,0.35),
        0 0 120px rgba(6,95,70,0.2),
        inset 0 0 40px rgba(52,211,153,0.06);
      animation: cardFloat 4s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }
    .welcome-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(52,211,153,0.08) 0%, transparent 60%);
      animation: shimmer 8s linear infinite;
    }
    @keyframes cardFloat {
      0%,100% { transform: translateY(0); box-shadow: 0 0 60px rgba(16,185,129,0.35), 0 0 120px rgba(6,95,70,0.2); }
      50% { transform: translateY(-6px); box-shadow: 0 0 80px rgba(52,211,153,0.5), 0 0 140px rgba(16,185,129,0.25); }
    }
    @keyframes shimmer {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .welcome-card h1 {
      font-size: 28px; font-weight: 700; line-height: 1.3;
      background: linear-gradient(105deg, #6ee7b7, #34d399, #a7f3d0, #34d399);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      animation: textShine 5s linear infinite;
      position: relative;
    }
    @keyframes textShine {
      to { background-position: 200% center; }
    }

    .welcome-emojis {
      font-size: 34px;
      margin: 14px 0 16px;
      letter-spacing: 12px;
      filter: drop-shadow(0 0 12px rgba(255,105,180,0.5));
    }
    .welcome-sub {
      font-size: 14px;
      color: #a7f3d0;
      letter-spacing: 2px;
      margin-bottom: 30px;
      font-weight: 500;
      opacity: 0.95;
    }
    #enterBtn {
      background: linear-gradient(90deg, #10b981, #34d399, #6ee7b7);
      background-size: 200% auto;
      border: none;
      color: #042f1a;
      font-size: 15px;
      font-weight: 700;
      padding: 16px 34px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.6px;
      box-shadow: 0 0 30px rgba(16,185,129,0.55);
      transition: transform 0.25s, box-shadow 0.25s;
      position: relative;
      animation: btnGlow 3s ease-in-out infinite;
    }
    @keyframes btnGlow {
      0%,100% { background-position: 0% center; box-shadow: 0 0 30px rgba(16,185,129,0.55); }
      50% { background-position: 100% center; box-shadow: 0 0 45px rgba(52,211,153,0.75); }
    }
    #enterBtn:hover { transform: scale(1.06); box-shadow: 0 0 50px rgba(52,211,153,0.9); }
    #enterBtn:active { transform: scale(0.97); }

    #canvas-container { position: fixed; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Modal más elegante */
    #modal {
      position: fixed; inset: 0;
      background: rgba(2,4,8,0.82);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; opacity: 0; visibility: hidden;
      transition: all 0.4s ease;
      backdrop-filter: blur(12px);
    }
    #modal.show { opacity: 1; visibility: visible; }
    .modal-content {
      background: linear-gradient(165deg, rgba(10,40,32,0.95), rgba(4,18,14,0.98));
      border: 1.5px solid rgba(52,211,153,0.5);
      border-radius: 28px;
      padding: 28px 26px;
      max-width: 360px; width: 90%;
      text-align: center;
      box-shadow:
        0 0 60px rgba(16,185,129,0.4),
        0 0 100px rgba(255,255,255,0.12);
      transform: scale(0.88) translateY(12px);
      transition: transform 0.4s cubic-bezier(0.34,1.4,0.64,1);
      position: relative;
    }
    #modal.show .modal-content { transform: scale(1) translateY(0); }
    .modal-img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 20px;
      border: 1.5px solid rgba(52,211,153,0.45);
      box-shadow: 0 0 28px rgba(16,185,129,0.35);
    }
    .modal-msg {
      font-size: 16.5px;
      line-height: 1.6;
      color: #ecfdf5;
      margin-bottom: 22px;
      font-weight: 400;
      text-shadow: 0 0 20px rgba(167,243,208,0.3);
    }
    .modal-close {
      background: linear-gradient(90deg, #10b981, #34d399);
      border: none;
      color: #042f1a;
      padding: 11px 30px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 18px rgba(16,185,129,0.4);
    }
    .modal-close:hover {
      transform: scale(1.05);
      box-shadow: 0 0 28px rgba(52,211,153,0.6);
    }

    .modal-body { width: 100%; }

    /* Modal optimizado para horizontal */
    @media (orientation: landscape) and (max-height: 520px) {
      .modal-content {
        max-width: 560px;
        width: 90%;
        padding: 14px 18px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 16px;
        text-align: left;
      }
      .modal-img {
        width: 150px;
        min-width: 150px;
        max-height: 130px;
        margin-bottom: 0;
        border-radius: 14px;
      }
      .modal-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .modal-msg {
        font-size: 14.5px;
        margin-bottom: 10px;
        line-height: 1.45;
      }
      .modal-close {
        padding: 8px 20px;
        font-size: 13px;
        align-self: flex-start;
      }
    }

    #hint {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12,6,20,0.75);
      border: 1px solid rgba(255,105,180,0.35);
      color: #d1fae5;
      padding: 11px 22px;
      border-radius: 40px;
      font-size: 13px;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 24px rgba(255,105,180,0.15);
    }
    #hint.show { opacity: 1; }

    /* Contador más delicado */
    #counter {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8,20,16,0.7);
      border: 1px solid rgba(52,211,153,0.35);
      color: #a7f3d0;
      padding: 9px 20px;
      border-radius: 40px;
      font-size: 13.5px;
      z-index: 40;
      text-align: center;
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: opacity 1.2s;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 0 24px rgba(16,185,129,0.2);
      letter-spacing: 0.3px;
    }
    #counter.show { opacity: 1; }
    #counter span {
      color: #ecfdf5;
      font-weight: 600;
      text-shadow: 0 0 12px rgba(167,243,208,0.4);
    }

    /* Botón pantalla completa */
    #fsBtn {
      position: fixed;
      bottom: 22px;
      right: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(16,185,129,0.18);
      border: 1px solid rgba(52,211,153,0.45);
      color: #a7f3d0;
      font-size: 20px;
      cursor: pointer;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.6s, background 0.25s, transform 0.2s;
      backdrop-filter: blur(8px);
    }
    #fsBtn.show { opacity: 1; }
    #fsBtn:hover {
      background: rgba(16,185,129,0.4);
      transform: scale(1.08);
    }

    .modal-content{display:flex;flex-direction:column;max-height:90vh;overflow:hidden}
    .modal-img{max-height:150px;flex:0 0 auto}
    .modal-body{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
    .modal-msg{font-family:'Lora',Georgia,serif;font-size:15.5px;line-height:1.7;text-align:left;white-space:pre-line;
      overflow-y:auto;min-height:0;flex:1 1 auto;padding-right:8px;margin-bottom:14px;scrollbar-width:thin;scrollbar-color:rgba(52,211,153,.5) transparent}
    .modal-title{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:22px;font-weight:600;text-align:center;line-height:1.25;margin-bottom:12px;color:#fff;text-shadow:0 0 18px rgba(52,211,153,.6)}
    .modal-close{align-self:center;flex:0 0 auto}
    .welcome-card h1{font-family:'Playfair Display',Georgia,serif;font-style:italic}
    #counter{font-family:'Nunito',sans-serif}
    @media (orientation: landscape) and (max-height: 520px) {
      .modal-content{flex-direction:row;align-items:stretch;max-width:760px;width:92%;max-height:92vh;padding:14px 18px}
      .modal-img{width:150px;min-width:150px;max-height:150px;align-self:center}
      .modal-body{max-height:calc(92vh - 28px)}
      .modal-msg{font-size:14.5px;line-height:1.6}
      .modal-title{font-size:19px;text-align:left}
      .modal-close{align-self:flex-start}
    }
    .welcome-emojis{display:flex;align-items:flex-end;justify-content:center;gap:14px;letter-spacing:0;filter:drop-shadow(0 0 12px rgba(52,211,153,.55))}
    .welcome-emojis .lg{height:54px;width:auto}
    .welcome-emojis .lg:nth-child(2){height:66px}
    .lg.mini{height:1.15em;width:1.15em;vertical-align:-.22em}
    #fsBtn{display:flex;align-items:center;justify:center}

    /* ===== Mejoras finales ===== */
    #fsBtn{justify-content:center}
    #hint{border-color:rgba(52,211,153,0.4);box-shadow:0 0 24px rgba(16,185,129,0.18)}
    @media (max-width:430px){#hint{white-space:normal;width:86%;text-align:center;line-height:1.5;bottom:84px}}
    #fsBtn:not(.show){visibility:hidden}
    #muteBtn{position:fixed;bottom:22px;right:72px;width:46px;height:46px;border-radius:50%;
      background:rgba(16,185,129,0.18);border:1px solid rgba(52,211,153,0.45);color:#a7f3d0;cursor:pointer;z-index:40;
      display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;
      transition:opacity .6s,background .25s,transform .2s;backdrop-filter:blur(8px)}
    #muteBtn.show{opacity:1;visibility:visible}
    #muteBtn:hover{background:rgba(16,185,129,0.4);transform:scale(1.08)}
    #muteBtn .off{display:none}
    #muteBtn.muted .on{display:none}
    #muteBtn.muted .off{display:block}
    .modal-img{width:100%;height:auto;max-height:38vh;object-fit:contain;background:rgba(0,0,0,.28)}
    @media (orientation: landscape) and (max-height: 520px){
      .modal-img{width:170px;min-width:170px;height:auto;max-height:calc(92vh - 28px);align-self:center}
    }
    .modal-count{font-family:'Nunito',sans-serif;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;
      color:#6ee7b7;opacity:.85;text-align:center;margin-bottom:6px}
    #enterBtn.loading{opacity:.75;pointer-events:none}
    #loadErr{display:none;margin-top:16px;font-size:13px;line-height:1.5;color:#fecaca;position:relative}
    #anniv{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;z-index:60;pointer-events:none;opacity:0;transition:opacity 1.6s ease;padding:24px}
    #anniv.show{opacity:1}
    #anniv .a1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;
      font-size:clamp(30px,8.5vw,64px);line-height:1.15;
      background:linear-gradient(105deg,#a7f3d0,#ecfdf5,#6ee7b7,#ecfdf5);background-size:200% auto;
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      animation:textShine 5s linear infinite;filter:drop-shadow(0 0 22px rgba(52,211,153,.65))}
    #anniv .a2{margin-top:14px;font-family:'Nunito',sans-serif;font-size:clamp(13px,3.6vw,18px);letter-spacing:3px;
      color:#d1fae5;text-transform:uppercase;text-shadow:0 0 16px rgba(52,211,153,.6)}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<script>
window.__danceCv=document.createElement('canvas');

(function(){
'use strict';
/* =====================================================================
   CONFIG — canción "Ma Meilleure Ennemie" (≈117 BPM, intro suave ~10 s)
   ===================================================================== */

function makeGalaxy(){
  const N=1024,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
  let gr=g.createRadialGradient(N/2,N/2,0,N/2,N/2,N/2);

  g.fillStyle=gr;g.fillRect(0,0,N,N);
  const A=[255,179,217],B=[52,211,153];
  for(let i=0;i<6200;i++){
    const arm=i%3, r=Math.pow(Math.random(),.62)*470;
    const th=arm*TAU/3 + r/470*4.4 + (Math.random()-.5)*(.5+.5*(1-r/470));
    const sp=(Math.random()-.5)*r*.16;
    const x=N/2+Math.cos(th)*r+Math.cos(th+1.57)*sp, y=N/2+Math.sin(th)*r+Math.sin(th+1.57)*sp;
    const t=clamp(r/380,0,1), w=Math.random()<.14;
    const col=w?[255,255,255]:[mix(A[0],B[0],t),mix(A[1],B[1],t),mix(A[2],B[2],t)];
    g.fillStyle=`rgba(${col[0]|0},${col[1]|0},${col[2]|0},${rnd(.25,.95)})`;
    g.beginPath();g.arc(x,y,rnd(.5,1.9),0,TAU);g.fill();

}

/* =====================================================================

const CAM={cc:1,sc:0,cp:1,sp:0,S:2,cx:0,gy:0,D:900};
function proj(x,y,z,o){
  const x1=x*CAM.cc+z*CAM.sc, z1=-x*CAM.sc+z*CAM.cc;
  const Y=y*CAM.cp-z1*CAM.sp, d=z1*CAM.cp+y*CAM.sp, k=CAM.D/(CAM.D-d);
  o[0]=CAM.cx+x1*CAM.S*k; o[1]=CAM.gy-Y*CAM.S*k; o[2]=k;
}
function projLin(x,y,z){ // sin perspectiva (base del suelo)
  const x1=x*CAM.cc+z*CAM.sc, z1=-x*CAM.sc+z*CAM.cc;
  return [x1*CAM.S, -(y*CAM.cp-z1*CAM.sp)*CAM.S];
}

/* =====================================================================
   SUAVIZADO (resortes críticos) — todo el movimiento nace de aquí
   ===================================================================== */
const ST={},VL={};
function track(k,target,om,dt){
  if(ST[k]===undefined){ST[k]=target;VL[k]=0;}
  const x=ST[k],v=VL[k],a=om*om*(target-x)-2*om*v;
  VL[k]=v+a*dt;ST[k]=x+VL[k]*dt;return ST[k];
}

function ik(Sh,T,l1,l2,pole){
  let d=sub(T,Sh),L=len(d);const mx=(l1+l2)*.998;
  if(L>mx){d=mul(d,mx/L);L=mx;} if(L<1)L=1;
  const dir=mul(d,1/L),a=(l1*l1-l2*l2+L*L)/(2*L),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  let pp=sub(pole,mul(dir,dot(pole,dir)));const pl=len(pp);pp=pl<1e-4?[0,1,0]:mul(pp,1/pl);
  return {E:add(add(Sh,mul(dir,a)),mul(pp,h)),T:add(Sh,d)};
}

function buildBody(f,P,yaw,pitch,roll,crouch,feet,touch){

  const cp=Math.cos(pitch),sp=Math.sin(pitch),cr=Math.cos(roll),sr=Math.sin(roll);
  const upv=(x,y,z)=>{const y1=y*cp-z*sp,z1=y*sp+z*cp,x2=x*cr+y1*sr,y2=-x*sr+y1*cr;return loc(x2,y2,z1);};
  f.loc=loc;f.upv=upv;
  const pel=[P[0],.50*H_-crouch,P[2]];J.pelvis=pel;
  const A=v=>add(pel,v);
  J.waist=A(upv(0,.10*H_,0));J.chest=A(upv(0,.20*H_,0));J.neck=A(upv(0,.29*H_,0));
  J.head=add(A(upv(0,.385*H_,0)),loc(0,-.012*H_*touch,.05*H_*touch));

  const ank=.035*H_,pole=add(loc(0,0,1),loc(0,0,0));
  const fl=add(P,loc(feet.xl,ank+feet.ll,feet.zl)),fr=add(P,loc(feet.xr,ank+feet.lr,feet.zr));

  const kr=ik(J.hipR,fr,.245*H_,.245*H_,add(loc(0,0,1),loc(.25,0,0)));

  const i=t/.25,a=clamp(Math.floor(i),0,ENV.length-2),f=clamp(i-a,0,1);
  return mix(ENV[a],ENV[a+1],f);
}

/* =====================================================================
   AUDIO
   ===================================================================== */
let audio=document.getElementById('bgMusic'),audioOK=false,started=true,muted=false;
setInterval(()=>{audioOK=!!audio&&!audio.paused&&audio.readyState>1;},400);

/* =====================================================================
   ACTUALIZACIÓN (cinemática + partículas)
   ===================================================================== */
const _o=[0,0,0],PJ={m:{},w:{}};
let frameN=0;

function update(dt){
  frameN++;
  /* --- reloj de la canción --- */
  if(started){
    SC.clock+=dt;
    if(audio&&audioOK&&!audio.paused){
      const at=audio.currentTime,diff=at-(SC.clock%DUR);
      if(Math.abs(diff)>.3)SC.clock=at;else SC.clock+=diff*.08;
    }
    SC.clock%=DUR;
  }
  const t=SC.clock;SC.t=t;
  const b=(t-BEAT0)*BPM/60*SLOW;
  const eRaw=envAt(t),e=clamp(track('e',eRaw,1.6,dt),0,1),eSlow=track('eS',eRaw,.7,dt);
  const eN=clamp((e-.1)/.8,0,1);

  /* --- sección actual --- */
  const bStart=Math.ceil((INTRO_END-BEAT0)*BPM/60*SLOW);
  let name='intro',bi=0;
  if(b>=bStart){
    const n=Math.floor((b-bStart)/8);bi=(b-bStart)-n*8;
    if(n!==SC.lastN){SC.lastN=n;SC.cyc=SC.cyc===undefined?0:SC.cyc;
      if(eSlow<.5)SC.secName='tender';else{SC.secName=CYCLE[SC.cyc%CYCLE.length];SC.cyc++;}}
    name=SC.secName;
  }else{SC.lastN=-99;SC.cyc=0;}
  const T_=targets(name,bi,t);

  const sep0=track('sep',T_.sep,3.2,dt),ow=track('ow',T_.ow,3,dt),spinW=track('spin',T_.spin,3.2,dt);
  const pM=track('pM',T_.pM,3,dt),pW=track('pW',T_.pW,3,dt),Dd=clamp(track('dip',T_.dip,5,dt),0,1);
  const Klat=track('Klat',T_.Klat,3.5,dt),Kh=track('Kh',T_.Kh,3.5,dt);
  const mF=track('mF',T_.mF,3,dt),wF=track('wF',T_.wF,3,dt),wS=track('wS',T_.wS,3,dt);
  const sway=track('sway',T_.sway,2.5,dt),bounce=track('bounce',T_.bounce,3,dt),step=track('step',T_.step,3,dt);
  const touch=track('touch',T_.touch,3,dt);
  const up=track('up',T_.up,3,dt),hug=track('hug',T_.hug,3,dt),camB=track('camB',T_.cam,1.1,dt);

  /* --- órbita y giro (integrados + se acomodan al terminar) --- */
  const bps=BPM/60*SLOW;
  SC.theta+=ow*bps*dt;
  if(Math.abs(ow)<.18&&T_.ow===0){const tg=Math.PI*Math.round(SC.theta/Math.PI);SC.theta+=(tg-SC.theta)*(1-Math.exp(-dt*1.6));}
  SC.spinA+=spinW*bps*dt;
  if(Math.abs(spinW)<.3&&T_.spin===0){const tg=TAU*Math.round(SC.spinA/TAU);SC.spinA+=(tg-SC.spinA)*(1-Math.exp(-dt*2.2));}
  SC.gal+=dt*(.03+.06*eN);

  /* --- cámara --- */
  const camYaw=camB*2.9+.16+.30*Math.sin(TAU*t/26)+.12*Math.sin(TAU*t/9.5);
  const camPitch=.40+.035*Math.sin(t*.21);
  const pulse=Math.exp(-(((b%1)+1)%1)*4.5);
  const zoom=1+.012*pulse*(.3+eN);
  S=Math.min(W/200,H/300)*zoom;
  CAM.cc=Math.cos(camYaw);CAM.sc=Math.sin(camYaw);CAM.cp=Math.cos(camPitch);CAM.sp=Math.sin(camPitch);
  CAM.S=S;CAM.cx=W/2;CAM.gy=H*(W<H?.72:.75);

  /* --- posiciones de la pareja --- */
  const sep=sep0-14*Dd,r=Math.max(10,sep/2),th=SC.theta;
  const tan=[-Math.sin(th),0,Math.cos(th)],sw=sway*Math.sin(Math.PI*b/2);
  const C=mul(tan,sw);
  const Pm=add(C,[Math.cos(th)*r,0,Math.sin(th)*r]),Pw=add(C,[-Math.cos(th)*r,0,-Math.sin(th)*r]);
  const yM=Math.atan2(Pw[0]-Pm[0],Pw[2]-Pm[2]),yW=yM+Math.PI+SC.spinA;

  const bob=.5-.5*Math.cos(Math.PI*b);
  const feetFor=(f,ph,lead)=>{
    const H_=f.H,bx=(f.isM?.07:.075)*H_,sz=step*.085*H_*(1-Dd),la=step*6*(1-.6*Dd);
    const c=Math.cos(ph),s=Math.sin(ph);
    const o={xl:-bx,xr:bx,zl:sz*c,zr:-sz*c,ll:la*Math.max(0,-s),lr:la*Math.max(0,s)};
    if(lead){o.zl+=.30*H_*Dd;o.zr-=.20*H_*Dd;o.xl*=1+.5*Dd;o.xr*=1+.5*Dd;}
    else{o.lr+=24*Dd;o.zr-=.16*H_*Dd;}
    return o;
  };
  buildBody(MAN,Pm,yM,pM+.30*Dd,0,bounce*bob+28*Dd,feetFor(MAN,Math.PI*b,true),touch);
  buildBody(WOM,Pw,yW,pW-1.15*Dd,-.12*Dd,bounce*.7*bob+14*Dd,feetFor(WOM,Math.PI*b+Math.PI,false),touch);

  /* --- brazos --- */
  const mj=MAN.J,wj=WOM.J,rM=MAN.right,fM=MAN.fwd,rW=WOM.right,fW=WOM.fwd;
  const Hm=MAN.H,Hw=WOM.H;
  // punto de unión de manos (mano derecha de él + mano izquierda de ella: el lado que mira a cámara)
  const mid=mul(add(Pm,Pw),.5);
  let K=[mid[0]+rM[0]*Klat*Hm,Kh*Hm,mid[2]+rM[2]*Klat*Hm];
  K=clampReach(mj.shR,K,MAN.reach);K=clampReach(wj.shL,K,WOM.reach);K=clampReach(mj.shR,K,MAN.reach);
  let Km=clampReach(mj.shR,K,MAN.reach),Kw=clampReach(wj.shL,K,WOM.reach);
  Km=lerp3(Km,clampReach(mj.shR,wj.waist,MAN.reach),hug);Kw=lerp3(Kw,clampReach(wj.shL,mj.waist,WOM.reach),hug);
  // mano libre de él: espalda de ella ↔ abierta
  const back=add(add(wj.waist,mul(fM,.055*Hw)),mul(rM,-.04*Hw));
  const outM=add(mj.shL,add(mul(rM,-.42*Hm),[0,-.03*Hm,0]));
  let mFree=lerp3(back,outM,mF);
  // mano libre de ella: hombro de él ↔ abierta ↔ falda ↔ lanzada atrás (dip)
  const onSh=add(mj.shL,[0,.02*Hm,0]);
  const outW=add(wj.shR,add(WOM.loc(.36*Hw,0,-.08*Hw),[0,.02*Hw,0]));
  const skirt=add(wj.hipR,WOM.loc(.10*Hw,-.03*Hw,.05*Hw));
  const thrown=add(wj.shR,WOM.loc(.20*Hw,.28*Hw,-.30*Hw));
  let wFree=lerp3(lerp3(onSh,outW,wF),skirt,wS);wFree=lerp3(wFree,thrown,Dd);
  mFree=lerp3(mFree,add(mj.shL,[-.1*Hm,.45*Hm,0]),up);wFree=lerp3(wFree,add(wj.shR,[.1*Hw,.4*Hw,0]),up);
  const dn=[0,-1,0];
  buildArm(MAN,1,Km,add(dn,mul(rM,.6)));
  buildArm(MAN,-1,mFree,add(dn,mul(rM,-.6)));
  buildArm(WOM,-1,Kw,add(dn,mul(rW,-.6)));
  buildArm(WOM,1,wFree,add(dn,mul(rW,.6)));
  KPOS=lerp3(MAN.J.haR,WOM.J.haL,.5);

  /* --- proyección de articulaciones --- */
  for(const [f,pj] of [[MAN,PJ.m],[WOM,PJ.w]]){
    for(const k in f.J){const p=f.J[k];proj(p[0],p[1],p[2],_o);
      const prev=f.pp[k];const cur=[_o[0],_o[1],_o[2]];
      cur.v=prev?Math.hypot(cur[0]-prev[0],cur[1]-prev[1]):0;f.pp[k]=cur;pj[k]=cur;}
  }

  /* --- partículas de cuerpo y tela (resortes en pantalla) --- */
  const gt=t,flare=clamp(Math.abs(spinW)/1.6,0,1)+.14*eN+Math.abs(ow)*.12;
  for(const f of [MAN,WOM]){
    const J=f.J,H_=f.H;
    const upd=(p,x,y,z)=>{
      proj(x,y,z,_o);p.k2=_o[2];
      const ax=(_o[0]-p.x)*p.K-p.vx*p.D,ay=(_o[1]-p.y)*p.K-p.vy*p.D;
      p.vx+=ax*dt;p.vy+=ay*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    };
    for(const p of f.parts){
      const A=J[p.a],B=J[p.b],br=1+.12*Math.sin(gt*2.1+p.ph),rad=p.th*br;
      upd(p,A[0]+(B[0]-A[0])*p.t+p.o[0]*rad,A[1]+(B[1]-A[1])*p.t+p.o[1]*rad,A[2]+(B[2]-A[2])*p.t+p.o[2]*rad);
    }
    for(const p of f.cloth){
      let x,y,z;
      if(p.k==='skirt'){
        const rr=(.075*H_+p.l*(.05*H_+flare*.24*H_))*(1+.07*Math.sin(3*p.a+gt*3+p.l*4));
        const ang=p.a+f.yaw*1.0;
        x=J.pelvis[0]+Math.cos(ang)*rr;z=J.pelvis[2]+Math.sin(ang)*rr;
        y=J.pelvis[1]-.02*H_-p.l*(.30*H_-flare*.11*H_)+p.o[1]*1.2;
      }else if(p.k==='coat'){
        const S0=J.neck,E0=[J.pelvis[0],J.pelvis[1]-.18*H_,J.pelvis[2]];
        const q=lerp3(S0,E0,p.l),w=.115*H_*(1+p.l*.6);
        x=q[0]-f.fwd[0]*.07*H_*p.l+f.right[0]*p.u*w;y=q[1]+p.o[1];z=q[2]-f.fwd[2]*.07*H_*p.l+f.right[2]*p.u*w;
      }else{ // trenzas
        const bs=add(J.head,mul(f.right,p.s*.035*H_));
        x=bs[0]-f.fwd[0]*.035*H_*(.4+p.l)+f.right[0]*p.s*.012*H_*Math.sin(gt*3+p.l*5);
        y=bs[1]-.02*H_-p.l*.36*H_;
        z=bs[2]-f.fwd[2]*.035*H_*(.4+p.l)+f.right[2]*p.s*.012*H_*Math.sin(gt*3+p.l*5);
      }
      upd(p,x,y,z);
    }
  }

  /* --- ondas en el suelo al ritmo --- */
  const rb2=Math.floor(b/2);
  if(rb2!==SC.lastRip&&started){SC.lastRip=rb2;SC.ripples.push({b0:b,pink:(rb2&1)===0});if(SC.ripples.length>5)SC.ripples.shift();}

  /* --- corazones --- */
  if(Dd>.9&&!SC.heartBurst){SC.heartBurst=true;for(let i=0;i<14;i++)spawnHeart(mid);}
  if(Dd<.3)SC.heartBurst=false;
  if(started&&((name==='tender'&&Math.random()<dt*1.4)||(eN>.75&&Math.random()<dt*.5)))spawnHeart(mid);
  for(let i=SC.hearts.length-1;i>=0;i--){const h=SC.hearts[i];h.age+=dt;h.x+=h.vx*dt+Math.sin(h.age*2+h.ph)*10*dt;h.y+=h.vy*dt;if(h.age>h.life)SC.hearts.splice(i,1);}

  /* --- polvo estelar --- */
  const emit=(pt,rate)=>{
    if(Math.random()>rate*Q)return;const d=dust[dustI=(dustI+1)%DUST_MAX];
    d.l=d.ml=rnd(.7,1.6);d.x=pt[0]+rnd(-4,4);d.y=pt[1]+rnd(-4,4);d.vx=rnd(-14,14);d.vy=rnd(-18,6);d.s=rnd(.5,1.5);
    d.c=Math.random()<.2?SPR_WHITE:null;return d;
  };
  for(const [f,pj] of [[MAN,PJ.m],[WOM,PJ.w]]){
    for(const k of ['haL','haR','ftL','ftR','head']){
      const p=pj[k],rate=clamp(.05+p.v*.012,0,.7);const d=emit(p,rate);
      if(d&&!d.c)d.c=f.spr[(Math.random()*5)|0];
    }
  }
  for(const d of dust){if(d.l>0){d.l-=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=6*dt;}}

  /* --- cintas luminosas en las manos --- */
  const rp=[PJ.m.haR,PJ.m.haL,PJ.w.haR];
  RIB.forEach((rb,i)=>{rb.pts.push([rp[i][0],rp[i][1]]);if(rb.pts.length>26)rb.pts.shift();});

  /* --- estrellas fugaces --- */
  SC.nextShoot-=dt;
  if(SC.nextShoot<=0&&started){SC.nextShoot=rnd(5,9);const a=rnd(.4,.7);SC.shoot.push({x:rnd(.2,1)*W,y:rnd(0,.3)*H,vx:-Math.cos(a)*700,vy:Math.sin(a)*500,l:1});}
  for(let i=SC.shoot.length-1;i>=0;i--){const s=SC.shoot[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt*1.1;if(s.l<=0)SC.shoot.splice(i,1);}

  SC.pulse=pulse;SC.eN=eN;SC.b=b;SC.Dd=Dd;SC.mid=mid;SC.r=r;SC.camYaw=camYaw;
}
function spawnHeart(mid){
  proj(mid[0],150,mid[2],_o);
  SC.hearts.push({x:_o[0]+rnd(-40,40),y:_o[1]+rnd(-30,10),vx:rnd(-8,8),vy:-rnd(30,60),age:0,life:rnd(2.5,4),ph:rnd(0,TAU),s:rnd(14,26)});
}

/* =====================================================================
   DIBUJO
   ===================================================================== */
function drawSky(){
  const e=SC.eN,P=SC.pulse,t=SC.t;
  ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const R=Math.max(W,H)*.62;
  let g=ctx.createRadialGradient(W*.2,H*.2,0,W*.2,H*.2,R);
  g.addColorStop(0,`rgba(255,255,255,${.10+.05*e+.02*P})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(W*.85,H*.3,0,W*.85,H*.3,R);
  g.addColorStop(0,`rgba(16,185,129,${.10+.05*e+.02*P})`);g.addColorStop(1,'rgba(16,185,129,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const par=SC.camYaw*26;
  const lim=0;
  for(let i=0;i<lim;i++){const s=sky[i];
    const a=s.a*(.55+.45*Math.sin(t*s.sp+i));
    ctx.globalAlpha=a;ctx.fillStyle=s.c;
    const x=((s.x*W+par*s.d)%W+W)%W;ctx.fillRect(x,s.y*H,s.s,s.s);}
  ctx.globalAlpha=1;
}
function drawFloor(){
  const e=SC.eN,P=SC.pulse;
  const Rf=Math.max(W,H)*.66/S, k=(Rf*2)/GAL.width;
  const ex=projLin(1,0,0),ez=projLin(0,0,1),g=SC.gal,cg=Math.cos(g),sg=Math.sin(g);
  const A=[k*(cg*ex[0]+sg*ez[0]),k*(cg*ex[1]+sg*ez[1])],B=[k*(-sg*ex[0]+cg*ez[0]),k*(-sg*ex[1]+cg*ez[1])];
  const n=GAL.width/2,ox=CAM.cx,oy=CAM.gy;
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.78+.18*e+.06*P;
  ctx.setTransform(DPR*A[0],DPR*A[1],DPR*B[0],DPR*B[1],DPR*(ox-n*(A[0]+B[0])),DPR*(oy-n*(A[1]+B[1])));
  ctx.drawImage(GAL,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=1;
  // ondas al ritmo
  for(const rp of SC.ripples){
    const age=(SC.b-rp.b0)/6;if(age<0||age>1)continue;
    const rad=24+age*Rf*.55,al=Math.pow(1-age,1.7)*.55;
    ctx.strokeStyle=rp.pink?`rgba(255,150,205,${al})`:`rgba(110,231,183,${al})`;
    ctx.lineWidth=2.2*(1-age)+.6;ctx.beginPath();
    for(let i=0;i<=64;i++){const a=i/64*TAU;proj(Math.cos(a)*rad,0,Math.sin(a)*rad,_o);i?ctx.lineTo(_o[0],_o[1]):ctx.moveTo(_o[0],_o[1]);}
    ctx.stroke();
  }
  // resplandor bajo cada bailarín
  for(const [f,sp] of [[MAN,SPR_M[0]],[WOM,SPR_W[0]]]){
    const p=f.J.pelvis;proj(p[0],0,p[2],_o);const rr=62*S*_o[2]*(1+.15*P);
    ctx.globalAlpha=.55+.25*P;ctx.drawImage(sp,_o[0]-rr,_o[1]-rr*.4,rr*2,rr*.8);
  }
  ctx.globalAlpha=1;
}
function drawBones(f,pj){
  ctx.lineCap='round';
  const col=f.isM?'255,70,110':'60,235,170',sc=S;
  for(const [a,b,th] of f.lines){
    const A=pj[a],B=pj[b],w=th*f.th*2*sc*A[2];
    ctx.strokeStyle=`rgba(${col},.10)`;ctx.lineWidth=w*1.6;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
    ctx.strokeStyle=`rgba(${col},.22)`;ctx.lineWidth=Math.max(1,w*.45);ctx.stroke();
  }
}
function drawParts(f,lim){
  const spr=f.spr,gl=.9+.35*SC.eN+.3*SC.pulse;
  const draw=(arr,n)=>{
    for(let i=0;i<n;i++){const p=arr[i];const d=p.sz*2.4*S*(p.k2||1)*gl;
      ctx.globalAlpha=p.al*(.8+.2*Math.sin(SC.t*3+p.ph));
      ctx.drawImage(spr[p.c],p.x-d/2,p.y-d/2,d,d);}
  };
  draw(f.parts,Math.floor(f.parts.length*lim));draw(f.cloth,Math.floor(f.cloth.length*lim));
  ctx.globalAlpha=1;
}
function drawRibbons(){
  ctx.lineCap='round';
  RIB.forEach(rb=>{const p=rb.pts;
    for(let i=1;i<p.length;i++){const a=i/p.length;
      ctx.strokeStyle=rb.c;ctx.globalAlpha=a*a*.6;ctx.lineWidth=rb.w*a*(S/2);
      ctx.beginPath();ctx.moveTo(p[i-1][0],p[i-1][1]);ctx.lineTo(p[i][0],p[i][1]);ctx.stroke();}});

}
function render(){
  drawSky();drawFloor();
  ctx.globalCompositeOperation='lighter';
  // orden por profundidad aproximada (aditivo: da igual, pero así las cintas quedan arriba)
  drawBones(MAN,PJ.m);drawBones(WOM,PJ.w);
  drawParts(MAN,Q);drawParts(WOM,Q);
  // cabezas
  for(const [pj,sp] of [[PJ.m,SPR_M[4]],[PJ.w,SPR_W[4]]]){const h=pj.head,d=26*S*h[2]*(1+.1*SC.pulse);ctx.globalAlpha=.55;ctx.drawImage(sp,h[0]-d/2,h[1]-d/2,d,d);}

  drawRibbons();
  // chispa donde se toman de la mano
  proj(KPOS[0],KPOS[1],KPOS[2],_o);
  const ks=(18+10*SC.pulse)*S*_o[2]*.6;ctx.globalAlpha=.9;ctx.drawImage(SPR_WHITE,_o[0]-ks/2,_o[1]-ks/2,ks,ks);
  ctx.globalAlpha=.7;ctx.drawImage(SPR_PINK,_o[0]-ks,_o[1]-ks,ks*2,ks*2);ctx.globalAlpha=1;
  // polvo estelar
  for(const d of dust){if(d.l<=0)continue;const a=d.l/d.ml,sz=d.s*S*3.2*(.4+a);
    ctx.globalAlpha=a*.85;ctx.drawImage(d.c||SPR_WHITE,d.x-sz/2,d.y-sz/2,sz,sz);}
  // corazones
  for(const h of SC.hearts){const a=Math.min(1,h.age*1.5)*Math.min(1,(h.life-h.age)*1.2);
    ctx.globalAlpha=a*.9;const s=h.s*(S/2.2);ctx.drawImage(HEART,h.x-s/2,h.y-s/2,s,s);}
  // estrellas fugaces
  for(const s of SC.shoot){ctx.globalAlpha=s.l;ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.beginPath();
    ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*.09,s.y-s.vy*.09);ctx.stroke();}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='destination-in';
  const mg=ctx.createRadialGradient(W/2,H*.5,H*.2,W/2,H*.5,H*.5);mg.addColorStop(0,'rgba(0,0,0,1)');mg.addColorStop(.7,'rgba(0,0,0,.9)');mg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mg;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  if(window.__danceTex)window.__danceTex.needsUpdate=true;
}

/* =====================================================================
   BUCLE
   ===================================================================== */
function resize(){DPR=1;W=512;H=768;cv.width=W;cv.height=H;ctx.setTransform(1,0,0,1,0,0);makeSky();}
resize();

let last=0,avg=1/60,slow=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!last){last=now;return;}
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  avg+=(dt-avg)*.05;
  if(avg>.027){slow++;if(slow>30){Q=Math.max(.55,Q-.05);slow=0;}}else if(avg<.019){slow--;if(slow<-120){Q=Math.min(1,Q+.05);slow=0;}}
  update(dt);render();
}
if(typeof window!=='undefined'){window.__dbg=null;}
requestAnimationFrame(loop);
})();

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    function loadScript(src){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e);});}
    async function ensureThree(){
      if(!window.THREE){
        for(const u of ['https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js']){
          try{await loadScript(u);if(window.THREE)break;}catch(e){}

      }

        for(const u of ['https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js']){
          try{await loadScript(u);if(THREE.OrbitControls)break;}catch(e){}
        }
      }
      return !!(window.THREE && THREE.OrbitControls);
    }
    const mensajes = [{"t": "El mejor año de mi vida", "m": "Quiero comenzar diciéndote que muchas gracias por este tiempo juntos, por cada momento, cada sonrisa, cada abrazo y cada recuerdo que hemos construido. De verdad, este ha sido el mejor año que he vivido. No porque todos los días hayan sido perfectos, sino porque he tenido la oportunidad de compartirlos contigo. Llegaste a mi vida y, sin darte cuenta, comenzaste a convertir momentos normales en recuerdos que quiero conservar para siempre. No sabes lo feliz que me hace poder decir que eres parte de mi historia. Si pudiera volver a vivir este año desde el principio, sabiendo todo lo que pasaría, volvería a elegir cada momento contigo."}, {"t": "Gracias por nuestro aniversario", "m": "Muchas gracias por nuestro aniversario, por permitirme celebrar otro pedacito de nuestra historia y por seguir compartiendo tu tiempo conmigo. Quizá no siempre encuentre las palabras exactas para explicarte lo importante que eres, pero quiero que sepas que valoro muchísimo todo lo que hemos vivido. Cada mes, cada fecha especial y cada pequeño detalle tienen un significado enorme para mí. Gracias por las experiencias, por las risas, por las conversaciones y por todos esos momentos que se han quedado guardados en mi corazón. Espero que podamos celebrar muchísimos aniversarios más y seguir mirando atrás con la felicidad de saber todo lo que hemos construido."}, {"t": "Nunca estarás sola", "m": "Quiero que tengas presente algo: mientras yo exista, siempre tendrás a alguien dispuesto a escucharte, acompañarte y apoyarte. No importa si estás teniendo un día maravilloso o si simplemente sientes que todo está saliendo mal. Quiero ser esa persona con la que puedas hablar sin miedo, sin tener que fingir que estás bien y sin sentir que tienes que esconder lo que piensas. No tienes que cargar con todo tú sola ni encontrar siempre las palabras correctas. Puedes contarme lo que sea, a tu ritmo y cuando quieras. Siempre voy a valorar que confíes en mí."}, {"t": "Nunca te juzgaré", "m": "Quiero que sepas que conmigo puedes ser completamente tú. Puedes contarme tus pensamientos, tus preocupaciones, tus errores, tus miedos y hasta esas cosas que quizá te cuesta compartir con otras personas. No estoy aquí para señalarte, burlarme de ti ni hacerte sentir menos por lo que piensas o sientes. Quiero escucharte, comprenderte y ayudarte cuando lo necesites. No espero que seas perfecta, porque no tienes que serlo. Eres una persona y tienes derecho a equivocarte, aprender, cambiar de opinión y tener días difíciles. Mientras yo exista, tendrás a alguien que intentará comprenderte antes de juzgarte."}, {"t": "Siempre voy a apoyarte", "m": "Quiero verte cumplir tus sueños, alcanzar tus metas y convertirte en todo aquello que deseas ser. Quiero estar presente cuando consigas algo que te costó muchísimo trabajo y también cuando las cosas no salgan como esperabas. No quiero apoyarte solamente cuando todo vaya bien, sino también cuando necesites ánimo para volver a intentarlo. Nunca quiero que sientas que tienes que abandonar tus sueños por estar conmigo. Al contrario, quiero impulsarte a crecer, aprender y descubrir todo lo que eres capaz de conseguir. Tus logros también me harán feliz, porque me encanta verte avanzar."}, {"t": "Mi persona favorita", "m": "Eres mi persona favorita, y no solamente por las cosas bonitas que haces, sino por todo lo que eres. Me encantan tus ocurrencias, tu manera de hablar, tus expresiones, tus pequeñas manías y hasta esas cosas que probablemente tú consideras insignificantes. Me gusta conocerte cada día un poquito más, descubrir nuevas partes de ti y aprender cosas que antes no sabía. No necesito que hagas algo extraordinario para hacerme feliz. Muchas veces basta con recibir un mensaje tuyo, escuchar tu voz o saber cómo estuvo tu día para sentirme mucho mejor. Me encanta que seas tú."}, {"t": "Volvería a conocerte", "m": "Si tuviera la oportunidad de regresar al momento en el que todavía no nos conocíamos, volvería a recorrer todo el camino que me llevó hasta ti. Volvería a tener nuestras primeras conversaciones, volvería a descubrir tu personalidad y volvería a emocionarme por cada pequeño detalle. Incluso si tuviera que pasar nuevamente por todas las casualidades que hicieron posible que nos encontráramos, lo haría. Porque conocerte ha sido una de las experiencias más bonitas de mi vida. Me encanta nuestra historia, incluso las partes que todavía estamos escribiendo."}, {"t": "Quiero quedarme a tu lado", "m": "Quiero que sepas que mi intención es seguir a tu lado. No quiero que seas solamente una persona que pasó por mi vida y dejó recuerdos bonitos; quiero que sigamos creando muchos más. Quiero acompañarte en tus etapas, conocer tus nuevas versiones y aprender a quererte en cada una de ellas. No prometo que todo será perfecto ni que nunca tendremos desacuerdos, pero sí quiero esforzarme por hablar contigo, escucharte, comprenderte y solucionar las cosas juntos. No quiero rendirme ante las primeras dificultades. Quiero cuidar lo que tenemos porque realmente significa muchísimo para mí."}, {"t": "Tu felicidad me importa", "m": "Me importa muchísimo tu felicidad. Quiero verte sonreír, emocionarte por las cosas que te gustan, disfrutar tus pasatiempos y cumplir esos sueños que tanto deseas. También quiero que sepas que no tienes que estar feliz todo el tiempo para que yo quiera estar contigo. Puedes tener días malos, sentirte cansada, frustrarte o simplemente no tener ganas de hablar demasiado. No tienes que fingir nada conmigo. Me importa tu bienestar, tus sentimientos y todo aquello que forma parte de ti. Quiero que nuestra relación sea un espacio donde ambos podamos sentirnos queridos, respetados y tranquilos."}, {"t": "Nuestro pequeño universo", "m": "A veces pienso que tenemos un pequeño universo que solamente nosotros conocemos. Está lleno de nuestras bromas, nuestras conversaciones, las fotografías, los recuerdos, las palabras que utilizamos y esos momentos que quizá para otras personas no significan demasiado, pero que para nosotros son especiales. Por eso hice esta pequeña galaxia. Quería regalarte algo diferente, algo que pudieras recorrer y en lo que encontraras un poquito de todo lo que siento por ti. Cada corazón representa una parte de nuestra historia y cada estrella me recuerda lo afortunado que soy de compartir este universo contigo."}, {"t": "Gracias por ser tú", "m": "Gracias por ser tú, por tu forma de querer, por tu personalidad y por permitirme conocer tantas partes de tu vida. Gracias por los momentos en los que me has hecho reír, por las veces que me has escuchado y por cada detalle que has tenido conmigo. Quiero que sepas que no necesitas cambiar quién eres para merecer cariño. Me gusta conocerte tal como eres, con tus virtudes, tus defectos, tus ideas y tus sueños. No quiero que sientas que debes convertirte en alguien diferente para hacerme feliz. Me gusta la persona que eres y quiero seguir descubriéndola."}, {"t": "Los recuerdos que llevamos", "m": "Si pudiera guardar todos nuestros recuerdos en una cajita, seguramente necesitaría una muchísimo más grande. Hay tantos momentos que quisiera conservar: nuestras conversaciones, las risas, las fotografías, las pequeñas aventuras y hasta las cosas más sencillas que hemos compartido. Me gusta recordar cómo comenzó todo y darme cuenta de cuánto hemos vivido desde entonces. Quizá con el tiempo olvidemos algunos detalles, pero espero que nunca olvidemos lo bonito que ha sido coincidir y compartir esta etapa de nuestras vidas. Quiero que sigamos acumulando recuerdos que algún día podamos mirar y decir: qué bonito fue vivir todo eso juntos."}, {"t": "Quiero verte crecer", "m": "Quiero acompañarte mientras creces, aprendes y descubres nuevas cosas sobre ti misma. Quiero verte alcanzar tus objetivos, comenzar nuevos proyectos y sentirte orgullosa de todo lo que consigues. Si algún día dudas de tus capacidades, quiero recordarte que puedes aprender, mejorar y volver a intentarlo. No tienes que tener toda tu vida resuelta ni saber exactamente qué hacer en cada momento. Está bien equivocarse y cambiar de camino. Yo quiero apoyarte en tus decisiones, respetar tus sueños y celebrar cada pequeño avance contigo. Siempre voy a desear que tengas una vida llena de oportunidades y cosas bonitas."}, {"t": "Qué suerte haberte encontrado", "m": "Es curioso pensar en todas las posibilidades que existían antes de conocernos. Cada uno tenía su propia vida, sus propios problemas, sus actividades y sus historias, hasta que de alguna manera nuestros caminos se cruzaron. Y ahora puedo decir que entre todas esas casualidades, encontrarte fue una de las más bonitas. No sé cómo habría sido mi vida si nunca hubiéramos coincidido, pero sí sé que me alegra muchísimo que lo hayamos hecho. Gracias por llegar, por quedarte y por permitirme compartir contigo tantos momentos que hoy significan muchísimo para mí."}, {"t": "Siempre tendrás un espacio conmigo", "m": "Quiero que tengas la confianza de acercarte a mí cuando necesites hablar. Si tienes un problema, te escucharé. Si estás emocionada por algo, quiero que me lo cuentes. Si necesitas desahogarte, puedes hacerlo sin preocuparte por encontrar las palabras perfectas. No voy a minimizar lo que sientes ni a comparar tus problemas con los de otras personas. Lo que te importa merece ser escuchado. Quiero aprender a comprenderte mejor, saber cuándo necesitas un consejo y cuándo simplemente necesitas que alguien te preste atención. Tu voz y tus sentimientos siempre serán importantes para mí."}, {"t": "Hasta donde lleguen las estrellas", "m": "Si esta galaxia pudiera representar todo lo que siento, seguramente necesitaríamos muchísimas más estrellas para conseguirlo. Hay cosas que simplemente no sé explicar con palabras, pero que intento demostrarte con mis acciones, mis detalles y el tiempo que quiero compartir contigo. Quiero seguir descubriendo lugares, viviendo experiencias y construyendo recuerdos a tu lado. No sé qué tan lejos llegaremos ni qué sorpresas nos esperan, pero me emociona pensar en todas las posibilidades. Por ahora, solamente quiero disfrutar de este presente contigo y cuidar cada momento que tenemos."}, {"t": "Eres una parte muy bonita de mi vida", "m": "Desde que llegaste, muchas cosas comenzaron a tener un significado diferente. Me has regalado momentos que recuerdo con muchísimo cariño y experiencias que probablemente nunca habría imaginado vivir. Me gusta poder compartir contigo mis alegrías, mis ideas, mis proyectos y hasta las cosas más absurdas que se me ocurren. También quiero estar presente en tus días, conocer lo que te preocupa y acompañarte cuando necesites un poco de tranquilidad. No quiero que olvides lo importante que eres para mí ni lo agradecido que estoy por haberte conocido."}, {"t": "Me encantan tus pequeños detalles", "m": "Hay muchísimas cosas de ti que me encantan y algunas probablemente ni siquiera te imaginas. Tu forma de expresarte, tus gestos, tus risas, tus ocurrencias y esa manera tan tuya de hacer las cosas. Me gusta prestar atención a esos pequeños detalles porque son parte de lo que te hace única. A veces no necesito que ocurra algo especial para quedarme pensando en ti. Simplemente recuerdo alguna conversación o algún momento juntos y termino sonriendo. Espero que nunca dejes de ser tú y que siempre encuentres motivos para sentirte orgullosa de quien eres."}, {"t": "Gracias por elegirme", "m": "Gracias por elegirme para compartir una parte de tu vida, por confiar en mí y por permitirme formar parte de tus días. Sé que una relación no se construye solamente con palabras bonitas, sino también con paciencia, respeto, comunicación, comprensión y acciones. Por eso quiero esforzarme para demostrarte que valoro lo que tenemos. Quiero aprender de nuestros errores, reconocer cuando me equivoco y encontrar mejores maneras de hacerte sentir querida. No quiero dar por sentado tu cariño ni olvidar lo importante que es cuidar nuestra relación. Gracias por cada oportunidad de seguir construyendo esta historia juntos."}, {"t": "Mi promesa para ti", "m": "Y llegamos al último corazón de esta pequeña galaxia, pero eso no significa que nuestra historia termine aquí. Quiero darte las gracias por este aniversario y por regalarme el mejor año que he vivido. Gracias por cada recuerdo, cada sonrisa y cada momento que hemos compartido. Quiero que tengas algo muy presente: mientras yo exista, tendrás a alguien que desea escucharte, apoyarte y comprenderte. Alguien que no pretende juzgarte por tus errores, que quiere acompañarte en tus días difíciles y que también quiere celebrar contigo tus días felices. No quiero dejarte sola ante tus dificultades ni hacerte sentir que debes enfrentar todo sin apoyo. Quiero seguir eligiéndote, respetándote y cuidando lo que estamos construyendo. No puedo prometerte que la vida siempre será sencilla, pero sí puedo prometerte que pondré de mi parte para que nunca tengas que dudar de lo mucho que valoro estar contigo.\n\nY si algún día olvidas cuánto te quiero, vuelve a esta galaxia y recuerda que cada uno de estos corazones fue escrito pensando en ti. Hay millones de estrellas en el universo, pero ninguna podría reemplazar el lugar tan especial que tienes en mi vida.\n\nTe amo muchísimo. Feliz aniversario, mi solecito hermoso."}];

    function fadeMusicIn(){

    document.getElementById('enterBtn').addEventListener('click', async () => {

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x03010a, 0.004);

      camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1200);
      // Empieza dentro del túnel
      camera.position.set(0, 0, 80);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, window.innerWidth < 700 ? 1.75 : 2));
      renderer.setClearColor(0x03010a, 1);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.rotateSpeed = 0.5;
      controls.minDistance = 14;
      controls.maxDistance = 95;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 0.28;
      controls.enablePan = false;
      controls.enabled = false; // bloqueado durante el viaje

      raycaster = new THREE.Raycaster();
      raycaster.params.Points.threshold = 2.2; // más fácil tocar con el dedo
      mouse = new THREE.Vector2();

      createWarpTunnel();
      createGalaxyParticles();
      createHeartParticles();
      createCentralGlow();
      createOrbitingObjects();
      createTeAmoParticles();
      (function createDancePortal() {
        const tex = new THREE.CanvasTexture(window.__danceCv);
        tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
        window.__danceTex = tex;
        dancePlane = new THREE.Mesh(new THREE.PlaneGeometry(26, 39), new THREE.MeshBasicMaterial({
          map: tex, transparent: true, opacity: 0, depthWrite: false, depthTest: false, fog: false, side: THREE.DoubleSide
        }));
        dancePlane.material.color.setScalar(1.1);
        dancePlane.renderOrder = 10;
        const bc = document.createElement('canvas'); bc.width = bc.height = 256;
        const bx = bc.getContext('2d'), bg = bx.createRadialGradient(128, 128, 20, 128, 128, 128);
        bg.addColorStop(0, 'rgba(2,12,9,0.78)'); bg.addColorStop(0.65, 'rgba(2,12,9,0.45)'); bg.addColorStop(1, 'rgba(2,12,9,0)');
        bx.fillStyle = bg; bx.fillRect(0, 0, 256, 256);
        const back = new THREE.Mesh(new THREE.PlaneGeometry(34, 40), new THREE.MeshBasicMaterial({
          map: new THREE.CanvasTexture(bc), transparent: true, depthWrite: false, depthTest: false, fog: false, side: THREE.DoubleSide
        }));
        back.position.z = -0.05; back.renderOrder = 9;
        dancePlane.add(back);
        dancePlane.position.set(0, -17, 0);
        dancePlane.visible = false;
        scene.add(dancePlane);
      })();
      createOuterRing();
      createAmbientSparkles();
      createPulseRings();

      // Ocultar el universo hasta que termine el viaje
      if (particles) particles.visible = false;
      if (heartParticles) heartParticles.visible = false;
      if (teAmoParticles) teAmoParticles.visible = false;
      if (centralGlow) centralGlow.visible = false;
      if (outerRing) outerRing.visible = false;
      if (ambientSparkles) ambientSparkles.visible = false;
      pulseRings.forEach(r => r.visible = false);
      orbitingObjects.forEach(o => o.visible = false);

      scene.add(new THREE.AmbientLight(0x1a3c2e, 0.9));

      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      renderer.domElement.addEventListener('pointerup', onPointerUp);
      window.addEventListener('resize', onResize);

      introStart = Date.now();
      introPhase = 'warp';
      animate();
      started = true;
    }

    // ========== TÚNEL DE VIAJE (intro) ==========
    function createWarpTunnel() {
      const count = 12000;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const speeds = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 2 + Math.random() * 28;
        const z = (Math.random() - 0.5) * 200;
        positions[i*3]     = Math.cos(angle) * radius;
        positions[i*3 + 1] = Math.sin(angle) * radius;
        positions[i*3 + 2] = z;

        const usePink = Math.random() > 0.7;
        const c = usePink
          ? new THREE.Color().setHSL(0.40 + Math.random()*0.08, 0.9, 0.55 + Math.random()*0.35)
          : new THREE.Color().setHSL(0.0, 0, 0.75 + Math.random()*0.25);
        colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
        speeds[i] = 0.6 + Math.random() * 1.8;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('speed', new THREE.BufferAttribute(speeds, 1));

      warpTunnel = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.55,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      }));
      scene.add(warpTunnel);
    }

    function createGalaxyParticles() {
      const count = 26000;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const palette = [
        new THREE.Color(0x022c22),
        new THREE.Color(0x064e3b),
        new THREE.Color(0x047857),
        new THREE.Color(0x059669),
        new THREE.Color(0x10b981),
        new THREE.Color(0x34d399),
        new THREE.Color(0x6ee7b7),
        new THREE.Color(0xa7f3d0),
        new THREE.Color(0xd1fae5),
        new THREE.Color(0xecfdf5),
        new THREE.Color(0xffffff),
        new THREE.Color(0xffffff),
        new THREE.Color(0xbbf7d0)
      ];
      for (let i = 0; i < count; i++) {
        const radius = Math.pow(Math.random(), 0.68) * 95 + 1.5;
        const angle = Math.random() * Math.PI * 2;
        const spiral = radius * 0.14;
        const y = (Math.random() - 0.5) * (26 + radius * 0.22);
        positions[i*3]     = Math.cos(angle + spiral) * radius;
        positions[i*3 + 1] = y;
        positions[i*3 + 2] = Math.sin(angle + spiral) * radius;
        const c = palette[Math.floor(Math.random() * palette.length)];
        colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    function createHeartParticles() {

        x = (x * dens + (Math.random()-0.5)*1.25) * scale;
        y = (y * dens + (Math.random()-0.5)*1.25) * scale + 2.4;

    // Halo suave detrás del corazón central
    function createCentralGlow() {

    // Textura de partícula suave (círculo con glow) para corazones esponjosos
    function createSoftParticleTexture() {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.25, 'rgba(255,220,240,0.9)');
      g.addColorStop(0.55, 'rgba(255,150,200,0.45)');
      g.addColorStop(1, 'rgba(255,100,160,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    function createTextTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 480; canvas.height = 100;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 480, 100);
      // Fondo más sólido para máxima legibilidad
      ctx.fillStyle = 'rgba(4,24,18,0.72)';
      const rx = 16, ry = 18, rw = 448, rh = 64, rr = 22;
      ctx.beginPath();
      ctx.moveTo(rx + rr, ry);
      ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, rr);
      ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, rr);
      ctx.arcTo(rx, ry + rh, rx, ry, rr);
      ctx.arcTo(rx, ry, rx + rw, ry, rr);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(167,243,208,0.55)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.font = 'italic 700 34px "Playfair Display", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#34d399';
      ctx.shadowBlur = 26;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, 240, 50);
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ecfdf5';
      ctx.fillText(text, 240, 50);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // Crea un corazón esponjoso con forma más clara
    function createFluffyHeart(colorHSL, scale = 1.0) {
      const count = 320;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;
        // dens más alto = forma más definida, menos nube
        const dens = 0.65 + Math.pow(Math.random(), 0.7) * 0.35;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        x *= 0.092 * scale * dens;
        y *= 0.092 * scale * dens;
        // Dispersión controlada (mantiene forma de corazón)
        x += (Math.random() - 0.5) * 0.28 * scale;
        y += (Math.random() - 0.5) * 0.28 * scale;
        const z = (Math.random() - 0.5) * 0.45 * scale;

        positions[i*3]     = x;
        positions[i*3 + 1] = y;
        positions[i*3 + 2] = z;

        const c = new THREE.Color().setHSL(
          colorHSL.h + (Math.random() - 0.5) * 0.035,
          colorHSL.s * (0.88 + Math.random() * 0.12),
          colorHSL.l * (0.78 + Math.random() * 0.28)
        );
        colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        map: createSoftParticleTexture(),
        size: 0.52 * scale,
        vertexColors: true,
        transparent: true,
        opacity: 0.94,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      });

      return new THREE.Points(geo, mat);
    }

    function createOrbitingObjects() {
      const loader = new THREE.TextureLoader();
      // Tonos rosa / lila suaves para los corazones esponjosos
      const heartColors = [
        { h: 0.42, s: 0.80, l: 0.62 },
        { h: 0.45, s: 0.70, l: 0.66 },
        { h: 0.40, s: 0.15, l: 0.94 },
        { h: 0.38, s: 0.75, l: 0.60 },
        { h: 0.47, s: 0.12, l: 0.96 },
        { h: 0.43, s: 0.85, l: 0.58 },
        { h: 0.41, s: 0.20, l: 0.92 },
        { h: 0.46, s: 0.78, l: 0.64 }
      ];
      const total = 66; // ~30 fotos + ~15 corazones intercalados
      // Más alejados y dispersos alrededor del corazón grande
      const radiusBase = 32;
      const radiusSpread = 14;
      let photoCounter = 0;

      for (let i = 0; i < total; i++) {
        // Ángulos bien repartidos para que fotos y corazones vayan mezclados
        const angle = (i / total) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
        const radius = radiusBase + (Math.random() - 0.5) * radiusSpread;
        const yBase = (Math.random() - 0.5) * 18;
        const speed = 0.065 + Math.random() * 0.15;
        const ySpeed = 0.15 + Math.random() * 0.35;
        // Mezclar fotos y corazones (no todo un lado de cada cosa)
        // Patrón: foto, foto, corazón, foto, foto, corazón...
        const isPhoto = ('PHPHPHPHPHH'[i % 11] === 'P');

        if (isPhoto) {
          const imgIndex = photoCounter % imagenes.length;
          photoCounter++;
          loader.load(imagenes[imgIndex], (texture) => {
            const isMobile = window.innerWidth < 700;
            const photoSize = isMobile ? 3.9 : 5.4;
            texture.minFilter = THREE.LinearFilter; texture.generateMipmaps = false;
            const iw = texture.image.width || 1, ih = texture.image.height || 1;
            const pw = iw >= ih ? photoSize : photoSize * iw / ih;
            const ph = iw >= ih ? photoSize * ih / iw : photoSize;
            const geo = new THREE.PlaneGeometry(pw, ph);
            const mat = new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              side: THREE.DoubleSide,
              opacity: 0.96,
              depthWrite: false
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(Math.cos(angle)*radius, yBase, Math.sin(angle)*radius);
            mesh.userData = {
              type: 'photo', img: imagenes[imgIndex], angle, radius, speed, ySpeed, yBase, index: i,
              phase: Math.random() * Math.PI * 2,
              floatAmp: 2.2 + Math.random() * 1.4
            };

            // Marco suave
            const borderGeo = new THREE.PlaneGeometry(pw + 0.35, ph + 0.35);
            const borderMat = new THREE.MeshBasicMaterial({
              color: 0x34d399,
              transparent: true,
              opacity: 0.42,
              side: THREE.DoubleSide,
              depthWrite: false
            });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.position.z = -0.04;
            mesh.add(border);

            const glowGeo = new THREE.PlaneGeometry(pw + 0.9, ph + 0.9);
            const glowMat = new THREE.MeshBasicMaterial({
              color: 0x34d399,
              transparent: true,
              opacity: 0.11,
              side: THREE.DoubleSide,
              depthWrite: false,
              blending: THREE.AdditiveBlending
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.z = -0.06;
            mesh.add(glow);

            mesh.visible = (introPhase !== 'warp'); // no aparecer antes del viaje
            scene.add(mesh);
            orbitingObjects.push(mesh);
          });
        } else {
          // Corazón esponjoso de partículas
          const group = new THREE.Group();
          const color = heartColors[i % heartColors.length];
          const isMobile = window.innerWidth < 700;
          const heartScale = isMobile
            ? (1.6 + Math.random() * 0.9)
            : (2.1 + Math.random() * 1.3);

          const fluffy = createFluffyHeart(color, heartScale);
          group.add(fluffy);

          // Texto flotante al lado
          const txt = textosCortos[i % textosCortos.length];
          const textMat = new THREE.SpriteMaterial({
            map: createTextTexture(txt),
            transparent: true,
            depthWrite: false
          });
          const textSprite = new THREE.Sprite(textMat);
          const textScale = isMobile ? 6.8 : 9.0;
          textSprite.scale.set(textScale, textScale * 0.22, 1);
          textSprite.position.set(heartScale * 1.05 + (isMobile ? 1.6 : 2.2), 0.25, 0);
          group.add(textSprite);

          group.position.set(Math.cos(angle)*radius, yBase, Math.sin(angle)*radius);
          group.userData = {
            type: 'heart',
            angle, radius, speed, ySpeed, yBase,
            index: i,
            text: txt,
            phase: Math.random() * Math.PI * 2,
            floatAmp: 2.4 + Math.random() * 1.6,
            spinSpeed: 0.15 + Math.random() * 0.25,
            pulseSpeed: 1.8 + Math.random() * 1.2
          };
          scene.add(group);
          orbitingObjects.push(group);
        }
      }
    }

    let _pd = null, imgQueue = [];
    function nextImage(){
      if (!imgQueue.length) {
        imgQueue = imagenes.map((_, i) => i);
        for (let i = imgQueue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [imgQueue[i], imgQueue[j]] = [imgQueue[j], imgQueue[i]]; }
      }
      return imagenes[imgQueue.pop()];
    }
    function onPointerDown(event) { _pd = { x: event.clientX, y: event.clientY, t: Date.now() }; }
    function onPointerUp(event) {
      if (!started || !_pd || introPhase !== 'done') { _pd = null; return; }
      const moved = Math.hypot(event.clientX - _pd.x, event.clientY - _pd.y), dt = Date.now() - _pd.t;
      _pd = null;
      if (moved > 10 || dt > 600) return; // fue un arrastre para girar, no un toque
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const targets = [];
      orbitingObjects.forEach(obj => {
        if (!obj.visible) return;
        if (obj.isGroup) obj.children.forEach(c => targets.push(c));
        else targets.push(obj);
      });
      const intersects = raycaster.intersectObjects(targets, false);
      if (intersects.length > 0) {
        let target = intersects[0].object;
        while (target.parent && !target.userData.type) target = target.parent;
        openModal(target.userData && target.userData.img);
      }
    }

    function openModal(img) {
      const mi = document.getElementById('modalImg');
      mi.onerror = () => { mi.style.display = 'none'; };
      mi.style.display = '';
      mi.src = img || nextImage();
      const idx = msgIdx++ % mensajes.length;
      const mm = mensajes[idx];
      const box = document.getElementById('modalMsg');
      box.innerHTML = '';
      const cc = document.createElement('div'); cc.className = 'modal-count'; cc.textContent = 'Mensaje ' + (idx + 1) + ' de ' + mensajes.length;
      const tt = document.createElement('div'); tt.className = 'modal-title'; tt.textContent = mm.t;
      const bb = document.createElement('div'); bb.textContent = mm.m;
      box.appendChild(cc); box.appendChild(tt); box.appendChild(bb);
      box.scrollTop = 0;
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    // ========== TE AMO escrito con partículas (más grande) ==========
    function createTeAmoParticles() {
      const letterPoints = [];
      const s = 1.45; // escala general más grande

      function addLine(x1, y1, x2, y2, dens = 26) {
        for (let i = 0; i <= dens; i++) {
          const t = i / dens;
          letterPoints.push({
            x: (x1 + (x2 - x1) * t) * s,
            y: (y1 + (y2 - y1) * t) * s
          });
        }
      }

      // T
      addLine(-11.8, 3.5, -8.5, 3.5);
      addLine(-10.15, 3.5, -10.15, -1.7);

      // E
      addLine(-7.5, 3.5, -7.5, -1.7);
      addLine(-7.5, 3.5, -4.85, 3.5);
      addLine(-7.5, 0.95, -5.25, 0.95);
      addLine(-7.5, -1.7, -4.85, -1.7);

      // A
      addLine(-3.0, -1.7, -1.4, 3.5);
      addLine(-1.4, 3.5, 0.3, -1.7);
      addLine(-2.3, 0.5, -0.3, 0.5);

      // M
      addLine(1.35, -1.7, 1.35, 3.5);
      addLine(1.35, 3.5, 2.8, 0.5);
      addLine(2.8, 0.5, 4.25, 3.5);
      addLine(4.25, 3.5, 4.25, -1.7);

      // O
      for (let i = 0; i < 36; i++) {
        const a = (i / 36) * Math.PI * 2;
        letterPoints.push({
          x: (7.5 + Math.cos(a) * 1.85) * s,
          y: (0.9 + Math.sin(a) * 2.45) * s
        });
      }

      const count = letterPoints.length * 5;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      let idx = 0;
      letterPoints.forEach(p => {
        for (let k = 0; k < 5; k++) {
          positions[idx*3]     = p.x + (Math.random()-0.5)*0.38;
          positions[idx*3 + 1] = p.y + (Math.random()-0.5)*0.38 + 2.4;
          positions[idx*3 + 2] = (Math.random()-0.5)*1.3;

          const c = new THREE.Color().setHSL(0.40 + Math.random()*0.08, 0.92, 0.70 + Math.random()*0.18);
          colors[idx*3] = c.r; colors[idx*3+1] = c.g; colors[idx*3+2] = c.b;
          idx++;
        }
      });

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      teAmoParticles = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.88,
        vertexColors: true,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      }));
      scene.add(teAmoParticles);
    }

    function createAmbientSparkles() {
      const count = 3200;

      for (let i = 0; i < count; i++) {
        const radius = 18 + Math.random() * 80;

        positions[i*3]     = radius * Math.sin(phi) * Math.cos(theta);
        positions[i*3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.75;
        positions[i*3 + 2] = radius * Math.cos(phi);

    // Anillos de pulso que se expanden con el ritmo de la música
    function createPulseRings() {
      pulseRings = [];
      for (let r = 0; r < 4; r++) {
        const count = 360;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const baseRadius = 34 + r * 12;

        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2;
          const jitter = 0.8 + Math.random() * 1.5;
          positions[i*3]     = Math.cos(a) * baseRadius * jitter;
          positions[i*3 + 1] = (Math.random() - 0.5) * 4;
          positions[i*3 + 2] = Math.sin(a) * baseRadius * jitter;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const color = r % 2 === 0 ? 0xffffff : 0xa7f3d0;
        const mat = new THREE.PointsMaterial({
          size: 1.1,
          color: color,
          transparent: true,
          opacity: 0.5,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          sizeAttenuation: true
        });
        const ring = new THREE.Points(geo, mat);
        ring.userData = {
          baseRadius,
          phase: r * 0.7,
          speed: 1.0 + r * 0.18
        };
        scene.add(ring);
        pulseRings.push(ring);
      }
    }

    // ========== ESTRELLAS FUGACES ==========
